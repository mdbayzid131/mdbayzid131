<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 180" width="100%" height="180" style="background:#090d16; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; border-radius: 12px;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="100%" stop-color="#0e1322" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a2be2" />
      <stop offset="100%" stop-color="#4a00e0" />
    </linearGradient>
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c6ff" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>
    <linearGradient id="pink-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f857a6" />
      <stop offset="100%" stop-color="#ff5858" />
    </linearGradient>

    <!-- Neon Glow -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="850" height="180" rx="12" fill="url(#card-grad)" />
  <rect width="848" height="178" x="1" y="1" rx="11" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.05" />

  <!-- 4 Columns/Blocks -->
  
  <!-- Column 1: Clean Code -->
  <g transform="translate(10, 0)">
    <!-- Glow behind icon -->
    <circle cx="95" cy="45" r="18" fill="#00f2fe" opacity="0.08" filter="url(#neon-glow)"/>
    <circle cx="95" cy="45" r="14" fill="url(#cyan-grad)" opacity="0.85" />
    <!-- Mini code symbol inside circle -->
    <path d="M91,41 L87,45 L91,49 M99,41 L103,45 L99,49" fill="none" stroke="#090d16" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="95" y="85" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="0.5">Clean Code</text>
    <text x="95" y="112" fill="#a9b1d6" font-size="10" font-weight="500" text-anchor="middle" opacity="0.8">Readable, structured</text>
    <text x="95" y="128" fill="#a9b1d6" font-size="10" font-weight="500" text-anchor="middle" opacity="0.8">and built to scale.</text>
  </g>

  <!-- Divider 1 -->
  <line x1="212" y1="35" x2="212" y2="145" stroke="#ffffff" stroke-width="1" opacity="0.06" />

  <!-- Column 2: User-First -->
  <g transform="translate(222, 0)">
    <circle cx="95" cy="45" r="18" fill="#8a2be2" opacity="0.08" filter="url(#neon-glow)"/>
    <circle cx="95" cy="45" r="14" fill="url(#purple-grad)" opacity="0.85" />
    <!-- Heart / empathy symbol -->
    <path d="M95,48.5 C95,48.5 89,45 89,42.5 C89,40.5 90.5,39 92.5,39 C93.7,39 94.6,39.6 95,40.5 C95.4,39.6 96.3,39 97.5,39 C99.5,39 101,40.5 101,42.5 C101,45 95,48.5 95,48.5 Z" fill="#090d16"/>

    <text x="95" y="85" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="0.5">User-First</text>
    <text x="95" y="112" fill="#a9b1d6" font-size="10" font-weight="500" text-anchor="middle" opacity="0.8">Design with empathy,</text>
    <text x="95" y="128" fill="#a9b1d6" font-size="10" font-weight="500" text-anchor="middle" opacity="0.8">build with precision.</text>
  </g>

  <!-- Divider 2 -->
  <line x1="425" y1="35" x2="425" y2="145" stroke="#ffffff" stroke-width="1" opacity="0.06" />

  <!-- Column 3: AI-Augmented -->
  <g transform="translate(435, 0)">
    <circle cx="95" cy="45" r="18" fill="#00c6ff" opacity="0.08" filter="url(#neon-glow)"/>
    <circle cx="95" cy="45" r="14" fill="url(#blue-grad)" opacity="0.85" />
    <!-- Lightning/AI speed symbol -->
    <path d="M96,37 L89,45 L94,45 L93,52 L101,44 L96,44 Z" fill="#090d16"/>

    <text x="95" y="85" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="0.5">AI-Augmented</text>
    <text x="95" y="112" fill="#a9b1d6" font-size="10" font-weight="500" text-anchor="middle" opacity="0.8">Leveraging modern AI</text>
    <text x="95" y="128" fill="#a9b1d6" font-size="10" font-weight="500" text-anchor="middle" opacity="0.8">to ship features faster.</text>
  </g>

  <!-- Divider 3 -->
  <line x1="638" y1="35" x2="638" y2="145" stroke="#ffffff" stroke-width="1" opacity="0.06" />

  <!-- Column 4: Continuous Growth -->
  <g transform="translate(648, 0)">
    <circle cx="95" cy="45" r="18" fill="#f857a6" opacity="0.08" filter="url(#neon-glow)"/>
    <circle cx="95" cy="45" r="14" fill="url(#pink-grad)" opacity="0.85" />
    <!-- Infinite / growth loop symbol -->
    <path d="M90,44.5 C90,42.5 91.5,41 93,42.5 L97,47.5 C98.5,49 100,47.5 100,45.5 C100,43.5 98.5,42 97,43.5 L93,48.5 C91.5,50 90,48.5 90,46.5 Z" fill="none" stroke="#090d16" stroke-width="1.8" stroke-linecap="round"/>

    <text x="95" y="85" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="0.5">Never Stop</text>
    <text x="95" y="112" fill="#a9b1d6" font-size="10" font-weight="500" text-anchor="middle" opacity="0.8">Continuous learning is</text>
    <text x="95" y="128" fill="#a9b1d6" font-size="10" font-weight="500" text-anchor="middle" opacity="0.8">my ultimate advantage.</text>
  </g>
</svg>
